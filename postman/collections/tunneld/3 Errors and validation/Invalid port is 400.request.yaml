$kind: http-request
name: Invalid port is 400
url: '{{base_url}}/api/tunnels'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "pm-bad-port",
      "port": 70000
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400', () => pm.response.to.have.status(400));
order: 5000

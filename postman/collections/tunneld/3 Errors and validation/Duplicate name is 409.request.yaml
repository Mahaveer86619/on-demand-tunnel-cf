$kind: http-request
url: '{{base_url}}/api/tunnels'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "PM Fixture",
      "port": 65001,
      "enabled": false
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 conflict', () => pm.response.to.have.status(409));
order: 3000

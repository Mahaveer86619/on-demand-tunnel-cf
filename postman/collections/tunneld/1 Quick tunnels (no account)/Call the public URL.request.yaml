$kind: http-request
description: |-
  Goes through Cloudflare to your service. A fresh quick tunnel can take a few seconds
  before DNS resolves; rerun if it fails right away.
url: '{{quick_url}}'
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('reached the target (not a tunnel error)', () => {
        pm.expect(pm.response.code).to.not.be.oneOf([502, 530, 1033]);
      });
order: 4000

$kind: http-request
name: Restart for a new URL
url: '{{base_url}}/api/tunnels/{{quick_id}}/restart'
method: POST
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 and restarting', () => {
        pm.response.to.have.status(200);
        pm.expect(pm.response.json().state).to.be.oneOf(['starting', 'connecting', 'running']);
      });
order: 8000

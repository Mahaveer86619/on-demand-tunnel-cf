$kind: collection
name: tunneld
description: |-
  API of tunneld (on-demand-tunnel-cf): publishes local ports through Cloudflare tunnels.

  Pick the "tunneld local" environment and set admin_token if ADMIN_TOKEN is set in .env.
  Run the folders in order: 1 is the no-account flow (random trycloudflare.com URLs),
  2 is the account flow (stable hostnames on your domain; needs CF_API_TOKEN and CF_DOMAIN).
  Requests in folders 1 and 2 open real public tunnels to target_port, so point it at
  something harmless (e.g. `python -m http.server 8080`). Folder 3 never exposes anything.
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{admin_token}}'
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code >= 400) {
        pm.test('error body has an "error" message', () => {
          pm.expect(pm.response.json()).to.have.property('error').that.is.a('string');
        });
      }
variables:
  - key: quick_id
    value: ''
    description: set by "Create quick tunnel"
  - key: quick_url
    value: ''
    description: set by "Wait for quick URL"
  - key: host_id
    value: ''
    description: set by "Create hostname tunnel"
